<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>Play chess vs <span class="google-word"><span class="google-blue">G</span><span class="google-red">o</span><span class="google-yellow">o</span><span class="google-blue">g</span><span class="google-red">l</span><span class="google-green">e</span></span></h1>
  <div id="colorChoice">
<div id="colorButtons">
<button class="google-btn" onclick="chooseColor('w')">Play as White</button>
<button class="google-btn" onclick="chooseColor('b')">Play as Black</button>
</div>
<div>
<p><span>#</span>Google AI level <span id="aiLevelValue"></span></p>
</div>
</div>

<div id="board"></div>

<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
min-height: 100vh;
padding: 32px 20px;
background: rgb(19, 19, 20);
color: white;
font-family: 'Google Sans', Arial, Helvetica, sans-serif;
text-align: center;
}
h1 {
margin: 0 0 28px;
font-size: 2rem;
font-weight: 600;
}
.google-word { white-space: nowrap; }
.google-blue { color: #4285f4; }
.google-red { color: #ea4335; }
.google-yellow { color: #fbbc05; }
.google-green { color: #34a853; }
#colorButtons {
display: flex;
justify-content: center;
flex-wrap: wrap;
gap: 24px;
margin-bottom: 24px;
}
.google-btn {
display: inline-flex;
align-items: center;
justify-content: center;
width: 120px;
height: 56px;
padding: 0 14px;
border: 0;
border-radius: 28px;
background: #4285f4;
color: #fff;
font: 500 1rem 'Google Sans', Arial, Helvetica, sans-serif;
text-decoration: none;
cursor: pointer;
box-shadow: 0 2px 4px rgba(60, 64, 67, .15);
transition: background .2s, box-shadow .2s;
}
.google-btn:hover {
background: #3367d6;
box-shadow: 0 4px 12px rgba(60, 64, 67, .18);
}
.google-btn:focus-visible {
outline: 3px solid #fbbc05;
outline-offset: 3px;
}
#board {
display: grid;
grid-template-columns: repeat(8, min(12vw, 60px));
width: max-content;
margin: 0 auto;
}
.square {
width: min(12vw, 60px);
height: min(12vw, 60px);
display: flex;
align-items: center;
justify-content: center;
font-size: min(9vw, 44px);
user-select: none;
}
.light { background: #a6afff; }
.dark { background: #5d5d5d; }
.piece { cursor: grab; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const files = "abcdefgh";

const symbols = {
K:"♔", Q:"♕", R:"♖", B:"♗", N:"♘", P:"♙",
k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟"
};

let game;
try {
  game = new Chess();
} catch (error) {
  console.error("Failed to initialize chess.js:", error);
}

const engineRoot = window.location.pathname.includes("/chess.google/") ? "./" : "./chess.google/";
const enginePath = new URL(`${engineRoot}stockfish/stockfish.js`, window.location.href).href;
let engine = null;
try {
  engine = new Worker(enginePath);
} catch (error) {
  console.error("Failed to load Stockfish worker:", error);
}

let playerColor = null;
let engineReady = false;
let thinking = false;
let draggedFrom = null;
let candidateMoves = new Map();
let aiLevel = getLevelFromLocalStorage();
const aiLevelValue = document.getElementById("aiLevelValue");
if (aiLevelValue) {
  aiLevelValue.textContent = String(aiLevel);
}

function getLevelFromLocalStorage() {
  try {
    const storedLevel = Number.parseInt(localStorage.getItem("level"), 10);
    return Number.isInteger(storedLevel) && storedLevel > 0 ? storedLevel : 10;
  } catch (error) {
    console.warn("localStorage is unavailable, using default AI level.", error);
    return 10;
  }
}

function chooseColor(color) {
  if (playerColor !== null || !game) return;

  playerColor = color;
  const colorButtons = document.getElementById("colorButtons");
  if (colorButtons) {
    colorButtons.remove();
  }

  renderBoard();

  if (game.turn() !== playerColor) {
    askStockfish();
  }
}

function renderBoard() {
  if (!game) return;

  const boardElement = document.getElementById("board");
  if (!boardElement) return;

  boardElement.replaceChildren();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const row = playerColor === "b" ? 7 - r : r;
      const col = playerColor === "b" ? 7 - c : c;
      const squareName = files[col] + (8 - row);
      const piece = game.board()[row][col];

      const square = document.createElement("div");
      square.className = "square " +
      ((row + col) % 2 === 0 ? "light" : "dark");
      square.dataset.square = squareName;

      if (piece) {
        const element = document.createElement("span");
        element.className = "piece";
        element.textContent = symbols[piece.color === "w"
        ? piece.type.toUpperCase()
        : piece.type];
        element.draggable = playerColor !== null &&
        piece.color === playerColor &&
        game.turn() === playerColor &&
        !thinking &&
        !game.game_over();

        element.addEventListener("dragstart", event => {
          if (!element.draggable) {
            event.preventDefault();
            return;
          }
          draggedFrom = squareName;
          event.dataTransfer.setData("text/plain", squareName);
        });

        square.appendChild(element);
      }

      square.addEventListener("dragover", e => e.preventDefault());

      square.addEventListener("drop", e => {
        e.preventDefault();

        if (!draggedFrom || thinking || !playerColor || !game ||
        game.turn() !== playerColor) return;

        const move = game.move({
          from: draggedFrom,
          to: squareName,
          promotion: "q"
        });

        draggedFrom = null;

        if (!move) {
          renderBoard();
          return;
        }

        renderBoard();

        if (!game.game_over()) askStockfish();
      });

      boardElement.appendChild(square);
    }
  }
}

function askStockfish() {
  if (!engine || !engineReady || thinking || !game || game.game_over()) return;

  thinking = true;
  candidateMoves.clear();
  renderBoard();

  engine.postMessage("position fen " + game.fen());
  engine.postMessage("go depth 10");
}

if (engine) {
  engine.onmessage = e => {
    const message = String(e.data).trim();
    console.log("Stockfish:", message);

    if (message === "uciok") {
      engine.postMessage("setoption name MultiPV value 5");
      engine.postMessage("isready");
    }

    if (message === "readyok") {
      engineReady = true;

      if (playerColor !== null && game && game.turn() !== playerColor) {
        askStockfish();
      }
    }

    if (message.startsWith("bestmove")) {
      thinking = false;

      const tokens = message.split(/\s+/);
      const bestMove = tokens[1];
      if (!bestMove || bestMove === "(none)" || bestMove === "0000") {
        renderBoard();
        return;
      }

      const alternatives = [...new Set(candidateMoves.values())]
        .filter(move => move !== bestMove);
      const bestMoveProbability = Math.min(1, aiLevel / 6);
      const move = alternatives.length > 0 && Math.random() >= bestMoveProbability
        ? alternatives[Math.floor(Math.random() * alternatives.length)]
        : bestMove;

      if (move && move !== "(none)" && move !== "0000") {
        const result = game.move({
          from: move.slice(0, 2),
          to: move.slice(2, 4),
          promotion: move[4] || "q"
        });

        if (!result) {
          console.error("Stockfish returned an illegal move:", move);
        }
      }

      renderBoard();
    }

    if (message.startsWith("info ")) {
      const tokens = message.split(/\s+/);
      const multipvIndex = tokens.indexOf("multipv");
      const pvIndex = tokens.indexOf("pv");

      if (multipvIndex !== -1 && pvIndex !== -1) {
        const variation = Number.parseInt(tokens[multipvIndex + 1], 10);
        const move = tokens[pvIndex + 1];

        if (Number.isInteger(variation) && variation >= 1 && variation <= 5 && move) {
          candidateMoves.set(variation, move);
        }
      }
    }
  };

  engine.onerror = e => {
    console.error("Stockfish loading error:", e);
    engineReady = false;
    thinking = false;
  };
}

renderBoard();
if (engine) {
  engine.postMessage("uci");
}
</script>
</body>
</html>
